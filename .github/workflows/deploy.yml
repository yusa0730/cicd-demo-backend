name: deploy

on:
  push:
    branches:
      - develop
      - stg
      - prod

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

  deploy:
    needs: resolve-environment
    name: Deploy to ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}

    env:
      ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 1. Read infra values from SSM Parameter Store ─────────────────────
      # terraform-repo writes these on every apply. app-repo never hardcodes them.
      - name: Get infra values from SSM
        env:
          PREFIX: /ecs-demo/${{ env.ENVIRONMENT }}
        run: |
          set -euo pipefail
          echo "Using SSM prefix: $PREFIX"

          get() {
            aws ssm get-parameter \
              --name "$PREFIX/$1" \
              --with-decryption \
              --query "Parameter.Value" \
              --output text
          }

          echo "ECR_REPOSITORY_URL=$(get ecr-repository-url)"    >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$(get ecs-cluster-name)"             >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$(get ecs-service-name)"             >> "$GITHUB_ENV"
          echo "TASK_DEF_FAMILY=$(get task-definition-family)"   >> "$GITHUB_ENV"
          echo "SUBNET_IDS=$(get ecs-subnet-ids)"                >> "$GITHUB_ENV"
          echo "SECURITY_GROUP_ID=$(get ecs-security-group-id)"  >> "$GITHUB_ENV"
          echo "ALB_DNS_NAME=$(get alb-dns-name)"                >> "$GITHUB_ENV"

      - name: Validate infra values
        run: |
          set -euo pipefail
          : "${ECR_REPOSITORY_URL:?ECR_REPOSITORY_URL is empty}"
          : "${ECS_CLUSTER:?ECS_CLUSTER is empty}"
          : "${ECS_SERVICE:?ECS_SERVICE is empty}"
          : "${TASK_DEF_FAMILY:?TASK_DEF_FAMILY is empty}"
          : "${SUBNET_IDS:?SUBNET_IDS is empty}"
          : "${SECURITY_GROUP_ID:?SECURITY_GROUP_ID is empty}"
          : "${ALB_DNS_NAME:?ALB_DNS_NAME is empty}"

      # ── 2. Build and push Docker image ────────────────────────────────────
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          ECR_REPO_NAME="$(basename "$ECR_REPOSITORY_URL")"

          if aws ecr describe-images \
              --repository-name "$ECR_REPO_NAME" \
              --image-ids imageTag="${GITHUB_SHA}" \
              --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "Image already exists in ECR, skipping build and push: $IMAGE_URI"
          else
            docker build -t "$IMAGE_URI" .
            docker push "$IMAGE_URI"
          fi

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      # ── 3. Register new ECS task definition ──────────────────────────────
      # image は containerOverrides で上書き不可のため、新リビジョンを登録してから使う。
      - name: Register new ECS task definition
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

          jq --arg IMAGE_URI "$IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == "app" then .image = $IMAGE_URI else . end
            )
            | del(
                .taskDefinitionArn, .revision, .status,
                .requiresAttributes, .compatibilities,
                .registeredAt, .registeredBy
              )
          ' task-definition.json > new-task-definition.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "NEW_TASK_DEF_ARN=$NEW_TASK_DEF_ARN" >> "$GITHUB_ENV"
          echo "new task definition: $NEW_TASK_DEF_ARN"

      # ── 4. DB migration as ECS one-off task ───────────────────────────────
      # 新Task Definition revisionで run-task し、command だけを override する。
      # migration 失敗時は service deploy へ進まない。
      - name: Run DB migration
        run: |
          set -euo pipefail

          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$NEW_TASK_DEF_ARN" \
            --network-configuration \
              "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides "{
              \"containerOverrides\": [
                {
                  \"name\": \"app\",
                  \"command\": [\"npm\", \"run\", \"migrate\"]
                }
              ]
            }" \
            --output json > run-task-result.json

          TASK_ARN=$(jq -r '.tasks[0].taskArn // empty' run-task-result.json)

          if [ -z "$TASK_ARN" ]; then
            echo "::error::Failed to start migration task"
            jq '.failures' run-task-result.json
            exit 1
          fi

          echo "migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --output json > task-result.json

          jq '{
            lastStatus: .tasks[0].lastStatus,
            stopCode: .tasks[0].stopCode,
            stoppedReason: .tasks[0].stoppedReason,
            containers: [.tasks[0].containers[] | {name, lastStatus, exitCode, reason}]
          }' task-result.json | tee /tmp/migration-summary.json

          echo "### ECS migration task result" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/migration-summary.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          EXIT_CODE=$(jq -r '.tasks[0].containers[] | select(.name=="app") | .exitCode // "NONE"' task-result.json)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::DB migration failed (exit code: $EXIT_CODE)"
            exit 1
          fi

          echo "DB migration succeeded"

      # ── 5. Deploy ECS service ─────────────────────────────────────────────
      # migration と同じ Task Definition revision を使うことでイメージを一致させる。
      - name: Deploy ECS service
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # ── 6. Smoke test ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS_NAME}/health")
            if [ "$STATUS" = "200" ]; then
              echo "smoke test passed (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTTP $STATUS — retrying in 10s"
            sleep 10
          done
          echo "::error::smoke test failed after 5 attempts"
          exit 1

      # ── 7. Slack notification ─────────────────────────────────────────────
      - name: Notify Slack deploy result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_DEPLOY }}
            text: "ECS deploy ${{ job.status == 'success' && 'success' || 'failure' }} — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *ECS deploy ${{ job.status == 'success' && 'success' || 'failure' }}*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.ref_name }}`
                    *Commit:* `${{ github.sha }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
