name: deploy

on:
  push:
    branches:
      - develop
      - stg
      - prod

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve target environment
        id: resolve
        run: |
          case "${{ github.ref_name }}" in
            develop) echo "environment=dev"  >> "$GITHUB_OUTPUT" ;;
            stg)     echo "environment=stg"  >> "$GITHUB_OUTPUT" ;;
            prod)    echo "environment=prod" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Unsupported branch: ${{ github.ref_name }}"
              exit 1
              ;;
          esac

  deploy:
    needs: resolve-environment
    name: Deploy to ${{ needs.resolve-environment.outputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}

    env:
      ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 1. Read infra values from SSM Parameter Store ─────────────────────
      # terraform-repo writes these on every apply. app-repo never hardcodes them.
      - name: Get infra values from SSM
        env:
          PREFIX: ${{ vars.SSM_PREFIX }}
        run: |
          get() { aws ssm get-parameter --name "$PREFIX/$1" --with-decryption --query Parameter.Value --output text; }

          echo "ECR_REPOSITORY_URL=$(get ecr-repository-url)"     >> $GITHUB_ENV
          echo "ECS_CLUSTER=$(get ecs-cluster-name)"              >> $GITHUB_ENV
          echo "ECS_SERVICE=$(get ecs-service-name)"              >> $GITHUB_ENV
          echo "TASK_DEF_FAMILY=$(get task-definition-family)"    >> $GITHUB_ENV
          echo "SUBNET_IDS=$(get ecs-subnet-ids)"                 >> $GITHUB_ENV
          echo "SECURITY_GROUP_ID=$(get ecs-security-group-id)"  >> $GITHUB_ENV
          echo "ALB_DNS_NAME=$(get alb-dns-name)"                 >> $GITHUB_ENV

      # ── 2. Build and push Docker image ────────────────────────────────────
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URL"

      - name: Build and push image
        run: |
          IMAGE_URI="${ECR_REPOSITORY_URL}:${GITHUB_SHA}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # ── 3. DB migration as ECS one-off task ───────────────────────────────
      # Uses the newly built image with command override.
      # ECS service deploy is skipped if this step fails.
      - name: Run DB migration
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEF_FAMILY" \
            --network-configuration \
              "awsvpcConfiguration={subnets=[$SUBNET_IDS],securityGroups=[$SECURITY_GROUP_ID],assignPublicIp=DISABLED}" \
            --overrides "{
              \"containerOverrides\": [
                {
                  \"name\": \"app\",
                  \"image\": \"$IMAGE_URI\",
                  \"command\": [\"npm\", \"run\", \"migrate\"]
                }
              ]
            }" \
            --query "tasks[0].taskArn" \
            --output text)

          echo "migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::DB migration failed (exit code: $EXIT_CODE)"
            exit 1
          fi

          echo "DB migration succeeded"

      # ── 4. Deploy ECS service ─────────────────────────────────────────────
      # Fetch current task definition from AWS (Terraform manages the base config),
      # replace only the image, register a new revision, and deploy.
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1.8.5
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ env.IMAGE_URI }}

      - name: Deploy ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ── 5. Smoke test ─────────────────────────────────────────────────────
      - name: Smoke test
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${ALB_DNS_NAME}/health")
            if [ "$STATUS" = "200" ]; then
              echo "smoke test passed (attempt $i)"
              exit 0
            fi
            echo "attempt $i: HTTP $STATUS — retrying in 10s"
            sleep 10
          done
          echo "::error::smoke test failed after 5 attempts"
          exit 1

      # ── 6. Slack notification ─────────────────────────────────────────────
      - name: Notify Slack deploy result
        if: always()
        continue-on-error: true
        uses: slackapi/slack-github-action@v3.0.3
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID_DEPLOY }}
            text: "ECS deploy ${{ job.status == 'success' && 'success' || 'failure' }} — ${{ env.ENVIRONMENT }}"
            unfurl_links: false
            unfurl_media: false
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: |
                    ${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *ECS deploy ${{ job.status == 'success' && 'success' || 'failure' }}*
                    *Environment:* `${{ env.ENVIRONMENT }}`
                    *Repository:* `${{ github.repository }}`
                    *Branch:* `${{ github.ref_name }}`
                    *Commit:* `${{ github.sha }}`
                    *Actor:* `${{ github.actor }}`
                    *Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|GitHub Actions>
